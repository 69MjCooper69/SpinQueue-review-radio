<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpinQueue Review Radio</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#38bdf8" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#38bdf8" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpinQueue Review Radio</title>
  <style>
    :root {
      --bg: #0c0f16;
      --panel: #151a24;
      --panel-2: #1c2330;
      --text: #f3f6fc;
      --muted: #9aa6bd;
      --accent: #38bdf8;
      --border: #283244;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #172236 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      width: 100%;
      max-width: 680px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .player-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .notes-section h2 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
      justify-content: space-between;
    }

    button {
      background: var(--accent);
      color: #071018;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>SpinQueue Review Radio</h1>
        <p class="subtitle">Listen to queue leftovers and jot down quick review notes.</p>
      </div>
      <span class="badge">Free App</span>
    </header>

    <section class="player-card" aria-label="Radio Player">
      <iframe
        src="https://spinqueue.com/embed/radio"
        width="100%"
        height="180"
        style="border:0;max-width:600px"
        allow="autoplay; encrypted-media"
        title="SpinQueue Radio">
      </iframe>
    </section>

    <section class="notes-section">
      <h2>Quick Review Notes</h2>
      <textarea
        id="reviewNotes"
        placeholder="Note track titles, artists, vibes, or feedback as you listen..."></textarea>
      <div class="actions">
        <div>
          <button type="button" id="saveBtn">Save Notes</button>
          <button type="button" class="secondary" id="clearBtn">Clear</button>
        </div>
        <span class="status" id="statusText">Saved locally in your browser</span>
      </div>
    </section>
  </main>

  <script>
    const notesEl = document.getElementById("reviewNotes");
    const saveBtn = document.getElementById("saveBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusText = document.getElementById("statusText");
    const STORAGE_KEY = "spinqueue_review_radio_notes";

    notesEl.value = localStorage.getItem(STORAGE_KEY) || "";

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, notesEl.value);
      statusText.textContent = "Notes saved locally";
    }

    saveBtn.addEventListener("click", saveNotes);
    notesEl.addEventListener("input", () => {
      localStorage.setItem(STORAGE_KEY, notesEl.value);
      statusText.textContent = "Auto-saved locally";
    });

    clearBtn.addEventListener("click", () => {
      notesEl.value = "";
      localStorage.removeItem(STORAGE_KEY);
      statusText.textContent = "Notes cleared";
    });
  </script>
</body>
</html>
